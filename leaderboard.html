<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OM Public School - Teacher Points Leaderboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #f1f5f9;
      color: #1e293b;
    }
    .leaderboard-header {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      color: white;
      text-align: center;
      padding: 2.5rem 1rem 4rem;
    }
    .leaderboard-header h1 {
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
    }
    .leaderboard-header h2 {
      font-size: 1.3rem;
      color: #94a3b8;
      font-weight: normal;
    }
    .leaderboard-container {
      max-width: 900px;
      margin: -2.5rem auto 3rem;
      padding: 0 1rem;
    }
    .summary-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .stat-card {
      background: white;
      padding: 1.2rem;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
      text-align: center;
    }
    .stat-number {
      font-size: 2rem;
      font-weight: bold;
      color: #4f46e5;
    }
    .stat-label {
      font-size: 0.85rem;
      color: #64748b;
      margin-top: 0.2rem;
    }
    .table-responsive {
      overflow-x: auto;
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
    }
    .leaderboard-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }
    .leaderboard-table th {
      background: #4f46e5;
      color: white;
      padding: 1rem;
      font-size: 0.95rem;
    }
    .leaderboard-table td {
      padding: 1rem;
      border-bottom: 1px solid #e2e8f0;
      vertical-align: middle;
    }
    .leaderboard-table tr:hover {
      background: #f8fafc;
    }
    .rank-badge {
      font-weight: bold;
      width: 32px;
      height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #e2e8f0;
      color: #334155;
    }
    .rank-1 { background: #fef08a; color: #854d0e; }
    .rank-2 { background: #e2e8f0; color: #475569; }
    .rank-3 { background: #fed7aa; color: #9a3412; }
    .teacher-profile {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }
    .teacher-avatar {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #e2e8f0;
    }
    .points-pill {
      background: #e0e7ff;
      color: #3730a3;
      font-weight: bold;
      padding: 0.4rem 0.8rem;
      border-radius: 20px;
      display: inline-block;
    }
    .badge-tag {
      background: #f1f5f9;
      color: #475569;
      font-size: 0.75rem;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      margin-right: 0.2rem;
      display: inline-block;
      margin-bottom: 0.2rem;
    }
    .message-btn {
      background: #e0e7ff;
      color: #4f46e5;
      border: none;
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .message-btn:hover {
      background: #c7d2fe;
    }
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.6);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }
    .modal-content {
      background: white;
      border-radius: 12px;
      width: 100%;
      max-width: 550px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
    }
    .modal-header {
      padding: 1.2rem;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-header h3 {
      font-size: 1.1rem;
      color: #1e293b;
    }
    .close-btn {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: #64748b;
    }
    .modal-body {
      padding: 1.2rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }
    .comment-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      padding: 0.8rem 1rem;
      border-radius: 8px;
    }
    .comment-meta {
      font-size: 0.8rem;
      font-weight: 600;
      color: #4f46e5;
      margin-bottom: 0.3rem;
    }
    .comment-text {
      font-size: 0.9rem;
      color: #334155;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <header class="leaderboard-header">
    <div style="display: flex; align-items: center; justify-content: center; gap: 0.8rem; margin-bottom: 0.5rem;">
      <img src="./logo.png" alt="OM Public School Logo" style="height: 50px;" onerror="this.style.display='none'">
      <h1>OM PUBLIC SCHOOL</h1>
    </div>
    <h2>🏆 Teacher Appreciation Points Leaderboard</h2>
  </header>

  <main class="leaderboard-container">
    <div class="summary-cards">
      <div class="stat-card">
        <div class="stat-number" id="total-points">0</div>
        <div class="stat-label">Total Points Awarded</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="total-evaluations">0</div>
        <div class="stat-label">Total Unique Students</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="total-messages">0</div>
        <div class="stat-label">Total Written Wishes</div>
      </div>
    </div>

    <div class="table-responsive">
      <table class="leaderboard-table">
        <thead>
          <tr>
            <th style="width: 70px;">Rank</th>
            <th>Teacher</th>
            <th>Total Points</th>
            <th>Avg Score</th>
            <th>Top Qualities</th>
            <th>Wishes</th>
          </tr>
        </thead>
        <tbody id="leaderboard-body">
          <tr>
            <td colspan="6" style="text-align: center; padding: 2rem;">Loading leaderboard data... ⏳</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

  <!-- Modal for Student Messages -->
  <div class="modal-overlay" id="messages-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modal-teacher-name">Student Wishes</h3>
        <button class="close-btn" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body" id="modal-body-content">
        <!-- Messages will be injected here -->
      </div>
    </div>
  </div>

  <script>
    const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxkUWjSI5Zvk3tHLR8gR92MKD9VB6QQkuiwqh2-OQrKKHlwvHmALQH8p1oLOuctYgFV/exec';

    let leaderboardCache = {};

    const teachersImages = {
      "Akshay Kamble": "./akshay_kamble.jpg.jpeg",
      "Amit Gupta": "./amit_gupta.jpg.jpeg",
      "ANAGHA SAMUDRA": "./anagha_samudra.jpg.jpeg",
      "Ashutosh Thorat": "./ashutosh_thorat.jpg.jpeg",
      "Binita Mohapatra": "./binita_mohapatra.jpg.jpeg",
      "Dhara Vyas": "./dhara_vyas.jpg.jpeg",
      "Dinesh Lagad": "./dinesh_lagad.jpg.jpeg",
      "INDIKA ARNAKAL": "./indika_arnakal.jpg.jpeg",
      "Jayanti Dash": "./jayanti_dash.jpg.jpeg",
      "Khairunnisa Sayed": "./khairunnisa_sayed.jpg.jpeg",
      "Mamta Yadav": "./mamta_yadav.jpg.jpeg",
      "Neeta Patil": "./neeta_patil.jpg.jpeg",
      "PANKAJ": "./pankaj.jpg.jpeg",
      "PRASANT KUMAR PANDEY": "./prasant_kumar_pandey.jpg.jpeg",
      "Prerna Poojari": "./prerna_poojari.jpg.jpeg",
      "Priyanka Redekar": "./priyanka_redekar.jpg.jpeg",
      "ROSHANI RAUT": "./roshani_raut.jpg.jpeg",
      "Santoshi Padhi": "./santoshi_padhi.jpg.jpeg",
      "SHALINI PANDEY": "./shalini_pandey.jpg.jpeg",
      "Sharvari Hirlekar": "./sharvari_hirlekar.jpg.jpeg",
      "SHRUTI SAXENA": "./shruti_saxena.jpg.jpeg",
      "SULOCHANA NAIR": "./sulochana_nair.jpg.jpeg",
      "Swati Khaire": "./swati_khaire.jpg.jpeg",
      "Vikash Yadav": "./vikash_yadav.jpg.jpeg",
      "VINAY KUMAR UPADHYAY": "./vinay_kumar_upadhyay.jpg.jpeg",
      "VINOD TAPASE": "./vinod_tapase.jpg.jpeg"
    };

    function renderLeaderboard(data) {
      const tbody = document.getElementById('leaderboard-body');

      if (!data || !data.teachers || Object.keys(data.teachers).length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 2rem;">No feedback recorded yet.</td></tr>';
        return;
      }

      leaderboardCache = data.teachers;

      const sortedTeachers = Object.values(data.teachers).sort((a, b) => b.totalPoints - a.totalPoints);

      let sumPoints = 0;
      let sumMessages = 0;
      const uniqueStudentSet = new Set();

      tbody.innerHTML = '';

      sortedTeachers.forEach((t, index) => {
        sumPoints += t.totalPoints || 0;
        const msgCount = t.messages ? t.messages.length : 0;
        sumMessages += msgCount;

        // Collect unique students across all teacher submissions
        if (t.messages && Array.isArray(t.messages)) {
          t.messages.forEach(msg => {
            if (msg.studentName && msg.studentName.trim() !== "") {
              const studentIdentifier = `${msg.studentName.trim().toLowerCase()}_${(msg.grade || '').trim().toLowerCase()}`;
              uniqueStudentSet.add(studentIdentifier);
            }
          });
        }

        const rank = index + 1;
        let rankClass = 'rank-badge';
        if (rank === 1) rankClass += ' rank-1';
        else if (rank === 2) rankClass += ' rank-2';
        else if (rank === 3) rankClass += ' rank-3';

        const topTags = (t.topQualities && t.topQualities.length > 0)
          ? t.topQualities.slice(0, 3).map(q => `<span class="badge-tag">${q}</span>`).join('')
          : '<span style="color:#94a3b8; font-size:0.8rem;">None</span>';

        const imgSrc = teachersImages[t.teacherName] || 'https://via.placeholder.com/45?text=Teacher';
        const encodedName = encodeURIComponent(t.teacherName);

        const row = document.createElement('tr');
        row.innerHTML = `
          <td><span class="${rankClass}">${rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : rank}</span></td>
          <td>
            <div class="teacher-profile">
              <img src="${imgSrc}" class="teacher-avatar" alt="${t.teacherName}" onerror="this.src='https://via.placeholder.com/45?text=Teacher'">
              <div>
                <strong style="color: #1e293b; font-size: 0.95rem;">${t.teacherName}</strong>
              </div>
            </div>
          </td>
          <td><span class="points-pill">${t.totalPoints || 0} Pts</span></td>
          <td>⭐ <strong>${t.avgRating || '0.0'}</strong> / 5.0</td>
          <td>${topTags}</td>
          <td>
            <button class="message-btn" onclick="openMessages('${encodedName}')">
              💬 ${msgCount} ${msgCount === 1 ? 'Wish' : 'Wishes'}
            </button>
          </td>
        `;
        tbody.appendChild(row);
      });

      // Calculate unique student count (use backend value if provided, else rely on client-side set count)
      const uniqueCount = data.totalStudents || uniqueStudentSet.size;

      document.getElementById('total-points').innerText = sumPoints;
      document.getElementById('total-evaluations').innerText = uniqueCount;
      document.getElementById('total-messages').innerText = sumMessages;
    }

    function openMessages(encodedName) {
      const teacherName = decodeURIComponent(encodedName);
      const teacherData = leaderboardCache[teacherName];
      
      const modal = document.getElementById('messages-modal');
      const title = document.getElementById('modal-teacher-name');
      const content = document.getElementById('modal-body-content');

      title.innerText = `Wishes for ${teacherName}`;
      content.innerHTML = '';

      if (!teacherData || !teacherData.messages || teacherData.messages.length === 0) {
        content.innerHTML = '<p style="text-align: center; color: #64748b; padding: 1rem;">No student comments submitted yet.</p>';
      } else {
        teacherData.messages.forEach(msg => {
          const card = document.createElement('div');
          card.className = 'comment-card';
          
          const studentInfo = (msg.studentName || msg.grade) 
            ? `${msg.studentName || 'Anonymous'} ${msg.grade ? '(' + msg.grade + ')' : ''}`
            : 'Student';

          card.innerHTML = `
            <div class="comment-meta">👤 ${studentInfo}</div>
            <div class="comment-text">"${msg.text}"</div>
          `;
          content.appendChild(card);
        });
      }

      modal.style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('messages-modal').style.display = 'none';
    }

    window.onclick = function(event) {
      const modal = document.getElementById('messages-modal');
      if (event.target === modal) {
        closeModal();
      }
    };

    async function fetchLeaderboard() {
      try {
        const response = await fetch(`${GOOGLE_SCRIPT_URL}?action=getLeaderboard`, {
          method: 'GET',
          redirect: 'follow'
        });
        if (!response.ok) throw new Error('Network response was not ok');
        const data = await response.json();
        renderLeaderboard(data);
      } catch (err) {
        console.warn('Fetch failed, trying JSONP fallback...', err);
        loadViaJsonp();
      }
    }

    function loadViaJsonp() {
      const script = document.createElement('script');
      script.src = `${GOOGLE_SCRIPT_URL}?callback=renderLeaderboard`;
      script.onerror = function() {
        document.getElementById('leaderboard-body').innerHTML = 
          '<tr><td colspan="6" style="text-align: center; color: #ef4444; padding: 2rem;">Error connecting to Google Script. Verify your web deployment permissions.</td></tr>';
      };
      document.body.appendChild(script);
    }

    document.addEventListener('DOMContentLoaded', fetchLeaderboard);
  </script>
</body>
</html>
