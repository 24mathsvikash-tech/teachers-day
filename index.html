<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Teachers' Day - Send Wishes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="hero">
    <h1>🎉 Happy Teachers' Day! 🎉</h1>
    <p>Select your class and roll number, pick your teachers' best qualities, and share your appreciation!</p>
    
    <div class="student-info-box">
      <div class="input-group">
        <label for="student-grade">Select Class:</label>
        <select id="student-grade">
          <option value="">-- Choose Class --</option>
          <option value="Grade 6">Grade 6</option>
          <option value="Grade 7">Grade 7</option>
          <option value="Grade 8">Grade 8</option>
          <option value="Grade 9">Grade 9</option>
          <option value="Grade 10">Grade 10</option>
        </select>
      </div>

      <div class="input-group">
        <label for="student-roll">Select Roll No:</label>
        <select id="student-roll">
          <option value="">-- Choose Roll No --</option>
          <option value="1">Roll No. 1</option>
          <option value="2">Roll No. 2</option>
          <option value="3">Roll No. 3</option>
          <option value="4">Roll No. 4</option>
          <option value="5">Roll No. 5</option>
          <option value="6">Roll No. 6</option>
          <option value="7">Roll No. 7</option>
          <option value="8">Roll No. 8</option>
          <option value="9">Roll No. 9</option>
          <option value="10">Roll No. 10</option>
          <option value="11">Roll No. 11</option>
          <option value="12">Roll No. 12</option>
          <option value="13">Roll No. 13</option>
          <option value="14">Roll No. 14</option>
          <option value="15">Roll No. 15</option>
          <option value="16">Roll No. 16</option>
          <option value="17">Roll No. 17</option>
          <option value="18">Roll No. 18</option>
          <option value="19">Roll No. 19</option>
          <option value="20">Roll No. 20</option>
          <option value="21">Roll No. 21</option>
          <option value="22">Roll No. 22</option>
          <option value="23">Roll No. 23</option>
          <option value="24">Roll No. 24</option>
          <option value="25">Roll No. 25</option>
          <option value="26">Roll No. 26</option>
          <option value="27">Roll No. 27</option>
          <option value="28">Roll No. 28</option>
          <option value="29">Roll No. 29</option>
          <option value="30">Roll No. 30</option>
          <option value="31">Roll No. 31</option>
          <option value="32">Roll No. 32</option>
          <option value="33">Roll No. 33</option>
          <option value="34">Roll No. 34</option>
          <option value="35">Roll No. 35</option>
          <option value="36">Roll No. 36</option>
          <option value="37">Roll No. 37</option>
          <option value="38">Roll No. 38</option>
          <option value="39">Roll No. 39</option>
          <option value="40">Roll No. 40</option>
        </select>
      </div>
    </div>
  </header>

  <main class="container">
    <div id="teacher-grid" class="teacher-grid">
      <!-- Cards rendered from app.js -->
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
