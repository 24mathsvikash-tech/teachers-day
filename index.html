<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OM Public School - Happy Teachers' Day</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- School Branding Header -->
  <header class="school-header">
    <div class="school-brand">
      <img src="./logo.png" alt="OM Public School Logo" class="school-logo">
      <h1 class="school-name">OM PUBLIC SCHOOL</h1>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="hero">
    <h2>🎉 Happy Teachers' Day! 🎉</h2>
    <p>Select your class and your name, pick your teachers' best qualities, and share your appreciation!</p>
    
    <div class="student-info-box">
      <div class="input-group">
        <label for="student-grade">Select Class:</label>
        <select id="student-grade" onchange="updateStudentNames()">
          <option value="">-- Choose Class --</option>
          <option value="Grade 6">Grade 6 (VI)</option>
          <option value="Grade 7">Grade 7 (VII)</option>
          <option value="Grade 8">Grade 8 (VIII)</option>
          <option value="Grade 9">Grade 9 (IX)</option>
          <option value="Grade 10">Grade 10 (X)</option>
        </select>
      </div>

      <div class="input-group">
        <label for="student-name">Select Your Name:</label>
        <select id="student-name">
          <option value="">-- Select Class First --</option>
        </select>
      </div>
    </div>
  </section>

  <main class="container">
    <div id="teacher-grid" class="teacher-grid">
      <!-- Cards rendered from app.js -->
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
